# /etc/nginx/sites-available/offizielle-praemien.tech
# Statische White-Page. Kein PHP, kein Node, kein Proxy, keine Cookies.

server {
    listen 80;
    listen [::]:80;
    server_name offizielle-praemien.tech www.offizielle-praemien.tech;

    root /var/www/offizielle-praemien;
    index index.html;

    charset utf-8;

    # Keine Verzeichnisliste, keine dotfiles
    autoindex off;
    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML nie lange cachen, sonst zeigen Bots alte Versionen
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/html text/css application/xml application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Logfiles: 7 Tage, siehe Datenschutzerklärung
    access_log /var/log/nginx/offizielle-praemien.access.log;
    error_log  /var/log/nginx/offizielle-praemien.error.log warn;

    error_page 404 /404.html;
}
